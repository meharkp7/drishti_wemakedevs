[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drishti"
version = "0.1.0"
description = "AI-assisted geospatial intelligence pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.6,<3",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "rasterio>=1.3,<2",
  "shapely>=2,<3",
  "pyproj>=3.6,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
training = ["segmentation-models-pytorch>=0.3.3,<1", "kagglehub>=0.3,<1"]

[tool.setuptools.packages.find]
include = [
  "adapters*",
  "backend*",
  "configs*",
  "crowdsource*",
  "datasets*",
  "geospatial*",
  "inference*",
  "training*",
]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
